name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Official Python images: setup-python has no 3.9 for new Ubuntu runners.
    container: python:${{ matrix.python }}-slim
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - run: python --version
      - run: python tests/run.py -v

  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: python3 tests/check_version.py origin/${{ github.base_ref }}

  release:
    # After the tests pass on main: tag and release a new __version__.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tag and release a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' cputune)
          if [ -z "$version" ]; then
            echo "cputune has no __version__ line"
            exit 1
          fi
          tag="v$version"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "$tag exists without a release: release the cputune of the tag"
            git show "$tag:cputune" > cputune
          fi
          gh release create "$tag" cputune --target "$GITHUB_SHA" --title "cputune $version" --generate-notes
